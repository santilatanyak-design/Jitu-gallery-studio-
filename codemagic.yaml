workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Install new Gradle
        script: wget https://services.gradle.org/distributions/gradle-9.6.1-bin.zip -O gradle.zip && unzip -d /opt gradle.zip && export PATH=$PATH:/opt/gradle-9.6.1/bin
      - name: Build Android APK
        script: /opt/gradle-9.6.1/bin/gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      
      
      
      
